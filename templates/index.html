<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Creator Compass</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

<div class="app">

    <!-- ======================================================
         SIDEBAR
    ======================================================= -->

    <aside class="sidebar">

        <h2>Creator Compass</h2>

        <nav>

            <a href="/">Home</a>

        </nav>

        <div class="version">

            Version 1.0

        </div>

    </aside>

    <!-- ======================================================
         MAIN
    ======================================================= -->

    <main class="main">

        <!-- ==================================================
             TOP BAR
        =================================================== -->

        <header class="topbar">

            <h1>Home</h1>

        </header>

        <!-- ==================================================
             HOME CONTENT
        =================================================== -->

        <section class="workspace">

            <h2>

                What would you like to create today?

            </h2>

            <div class="cards">

                <!-- ==========================================
                     CONTENT CREATOR
                =========================================== -->

                <a
                    href="/content_creator"
                    class="card">

                    <h3>

                        Content Creator

                    </h3>

                    <p>

                        YouTube • Instagram • TikTok

                    </p>

                </a>

                <!-- ==========================================
                     CREATIVE STUDIO
                =========================================== -->

                <a
                    href="/creative_studio"
                    class="card">

                    <h3>

                        CREATIVE STUDIO

                    </h3>

                    <p>

                        Art • Illustration • Character Design • Creative Ideas

                    </p>

                </a>

            </div>

        </section>

    </main>

</div>

</body>

</html>
